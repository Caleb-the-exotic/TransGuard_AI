# ==============================================================================
# Eclipse Mosquitto – TransGuard AI Industrial Broker Configuration
# ==============================================================================

# Default MQTT Port
listener 1883 0.0.0.0

# WebSocket listener for browser-direct connections (optional)
listener 9001 0.0.0.0
protocol websockets

# Persistence configuration
persistence true
persistence_location mosquitto_data/

# Allow anonymous during benchtop testing (set to false for production)
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 1000
